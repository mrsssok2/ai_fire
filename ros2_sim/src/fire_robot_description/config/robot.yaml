# Single source of truth for the robot's geometry and sensor mounts (metres / degrees).
# Read by the xacro (visuals), by the mesh generator and by the simulation nodes.
# Layout follows the photo of the Arduino version in the repo README (front = +X, left = +Y):
# the bottle sits rear-right, the big black battery rear-left, red L298N mid-board, SIM800L on the left side,
# breadboard + Arduino and the MQ gas module toward the front, flame sensors on the front corners and centre,
# servo + nozzle at the front.
chassis: {length: 0.30, width: 0.22, thickness: 0.008}
wheels: {radius: 0.0325, width: 0.026, x: 0.10, track: 0.25}     # axles at x = +-0.10, y = +-track/2

# Flame sensors (digital IR modules, LOW = flame). Mount pose in base_link; yaw 0 = straight ahead.
# half_angle_deg and range_m are SIMULATION parameters, not measured from the real modules:
# range_m = distance at which a fire of intensity 1.0 straight ahead just trips the sensor.
flame_sensors:
  half_angle_deg: 30.0
  range_m: 1.0
  left:  {x: 0.135, y: 0.09,  yaw_deg: 40.0}
  front: {x: 0.150, y: 0.0,   yaw_deg: 0.0}
  right: {x: 0.135, y: -0.09, yaw_deg: -40.0}

# Gas sensor (MQ-type module with digital output, LOW = gas). Simulation parameters.
gas_sensor: {x: 0.085, y: -0.045, threshold_ppm: 300.0}

# Servo + nozzle: the nozzle is mounted ON the servo horn and sweeps with it.
# servo angle 90 deg = straight ahead; joint angle = (servo - 90) deg, positive = left.
nozzle: {x: 0.115, y: 0.0, length: 0.06}
camera: {x: 0.03, y: 0.0, z: 0.105}

# Water system. Flow is the pump's rate while it runs (a small 12 V submersible pump is ~1.5 L/min = 25 ml/s).
tank: {x: -0.105, y: -0.055, radius: 0.04, height: 0.14, water_height: 0.12, capacity_ml: 500.0}
pump: {x: -0.045, y: -0.04, radius: 0.014, length: 0.045, flow_ml_s: 25.0}

# Clear tube: tank bottom -> pump inlet ... pump outlet -> along the board -> up to the nozzle on the servo horn.
# Waypoints (x, y, z above the board top); smoothed and swept into meshes/tube.obj by scripts/gen_robot_meshes.py.
tube:
  radius: 0.0042
  path:
    - [-0.078, -0.055, 0.010]      # bottom port of the bottle
    - [-0.072, -0.047, 0.016]
    - [-0.0675, -0.040, 0.0165]    # pump inlet
    - [-0.0225, -0.040, 0.0165]    # pump outlet
    - [-0.005, -0.040, 0.012]
    - [0.030, -0.032, 0.010]
    - [0.075, -0.020, 0.010]
    - [0.100, -0.010, 0.016]
    - [0.112, 0.000, 0.030]
    - [0.115, 0.000, 0.040]        # up to the horn
