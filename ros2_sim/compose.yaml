services:
  sim:
    image: fire_ros2:jazzy
    build: .
    environment:
      DISPLAY: ${DISPLAY:-:0}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /mnt/wslg/runtime-dir
      LD_LIBRARY_PATH: /usr/lib/wsl/lib
      GALLIUM_DRIVER: ${GZ_GALLIUM_DRIVER:-d3d12}      # GPU via WSL; GZ_GALLIUM_DRIVER=llvmpipe for CPU
      MESA_D3D12_DEFAULT_ADAPTER_NAME: ${GPU_ADAPTER:-NVIDIA}
      QT_QPA_PLATFORM: xcb
      QT_X11_NO_MITSHM: "1"
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
    devices: ["/dev/dxg"]
    volumes:
      - /mnt/wslg:/mnt/wslg
      - /mnt/wslg/.X11-unix:/tmp/.X11-unix
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - .:/home/ubuntu/ros2_sim
    mem_limit: 4g
    init: true
    command: ["/home/ubuntu/ros2_sim/scripts/start.sh"]
